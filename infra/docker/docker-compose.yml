# Self-hosting:
#   cp infra/docker/.env.example infra/docker/.env   # then edit it
#   docker compose -f infra/docker/docker-compose.yml up -d --build
#   docker compose -f infra/docker/docker-compose.yml exec analytics analytics sites add -domain example.com
#
# To run a published release instead of building from source:
#   ANALYTICS_IMAGE=ghcr.io/martinzachariassen/analytics-mlz-no:0.1.0 docker compose -f infra/docker/docker-compose.yml up -d --no-build
#
# The port binds to localhost: put a reverse proxy (Caddy, nginx, Traefik) with TLS in front and
# set PROXY_HOPS=1 in .env. The container runs read-only as an unprivileged user with no
# capabilities; /data is the only writable volume.
services:
  analytics:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    image: ${ANALYTICS_IMAGE:-analytics-mlz-no:local}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - analytics-data:/data
    env_file:
      - path: .env
        required: false
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3

volumes:
  analytics-data:
