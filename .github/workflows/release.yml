name: Release

# Publishes on a version tag: git tag v0.1.0 && git push origin v0.1.0
# A tag with a suffix (v0.1.0-rc.1) is published as a pre-release and does not move `latest`.
#
# The image and the binaries carry a build provenance attestation (SLSA) signed by GitHub, and
# the image an SBOM. Verify with `gh attestation verify oci://ghcr.io/... --owner martinzachariassen`
# or `gh attestation verify analytics_v0.1.0_linux_amd64.tar.gz --owner martinzachariassen`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      # The GeoIP file is the month before the tagged commit: always published (a release on the
      # 1st cannot outrun DB-IP), and the same whenever this tag is rebuilt.
      - id: month
        run: |
          first="$(git log -1 --format=%cd --date=format:%Y-%m-01)"
          echo "value=$(date -u -d "$first -1 month" +%Y-%m)" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
            DBIP_MONTH=${{ steps.month.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          sbom: true
          provenance: mode=max
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    needs: [ci, image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      # Static binaries (pure Go, no CGO). They contain no GeoIP database: set GEOIP_DB_PATH
      # to a DB-IP Lite country .mmdb file to record countries.
      - name: Build binaries
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            name=analytics_${GITHUB_REF_NAME}_${os}_${arch}
            mkdir "dist/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "dist/$name/analytics" ./apps/server/cmd/analytics
            cp LICENSE README.md "dist/$name/"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
            rm -r "dist/$name"
          done
          cd dist && sha256sum ./*.tar.gz > checksums.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*.tar.gz
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt \
            --title "$GITHUB_REF_NAME" --generate-notes $flags
