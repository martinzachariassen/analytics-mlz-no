name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # reused by release.yml as a gate before publishing

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job runs scripts/verify.sh with one group, so CI and `make verify` check the same things
# with the same tool versions (mise.toml).
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - run: bun install --frozen-lockfile
      - run: ./scripts/verify.sh lint

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - run: ./scripts/verify.sh go

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Relative links and #anchors only (--offline), so the job never fails on a flaky website.
      - uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --offline --include-fragments --no-progress '**/*.md'
          fail: true

  tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - run: bun install --frozen-lockfile
      - run: ./scripts/verify.sh tracker

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - run: bun install --frozen-lockfile
      - run: ./scripts/verify.sh web

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - run: ./scripts/verify.sh infra

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker build -f infra/docker/Dockerfile -t analytics-mlz-no:ci .

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
      - name: Known vulnerabilities in Go dependencies and the standard library
        working-directory: apps/server
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: bun install --frozen-lockfile
      # Only what ships to users: production dependencies of the dashboard.
      - name: bun audit (web)
        working-directory: apps/web
        run: bun audit --audit-level=high --prod
