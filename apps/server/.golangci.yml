version: "2"
linters:
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - perfsprint
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam
    - usestdlibvars
  settings:
    gosec:
      excludes:
        - G104 # unhandled errors are covered by errcheck
  exclusions:
    # npm packages may ship Go files (e.g. flatted); never lint them.
    paths:
      - node_modules
    rules:
      # Tests build request cookies and fixture URLs that gosec misreads as unsafe,
      # and call helpers without contexts on purpose.
      - path: _test\.go
        linters: [gosec, noctx, contextcheck]
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - node_modules
