name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # reused by release.yml as a gate before publishing

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod
      - run: go vet ./apps/server/...
      - run: go test -race ./apps/server/...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15
          working-directory: apps/server

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Relative links and #anchors only (--offline), so the job never fails on a flaky website.
      - uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --offline --include-fragments --no-progress '**/*.md'
          fail: true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f infra/docker/Dockerfile -t analytics-mlz-no:ci .

  tracker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tracker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/tracker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Check that the embedded script.js is up to date
        run: |
          npm run build
          git diff --exit-code -- ../server/internal/script/script.js || {
            echo "::error::apps/server/internal/script/script.js is stale. Run 'npm run build' in apps/tracker/ and commit."
            exit 1
          }
      - run: npm run check-size

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/server/go.mod
      - name: Known vulnerabilities in Go dependencies and the standard library
        working-directory: apps/server
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      # Only what ships to users: production dependencies of the dashboard.
      - name: npm audit (web)
        working-directory: apps/web
        run: npm audit --audit-level=high --omit=dev
