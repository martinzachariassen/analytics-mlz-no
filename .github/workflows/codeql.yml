name: CodeQL security scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 5 * * 1" # weekly, so new queries run against unchanged code too

permissions:
  contents: read

jobs:
  analyze:
    # A required check in scripts/github-settings.sh: rename both together.
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Manual: autobuild would run `make`, whose default target starts the server.
          - language: go
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install the pinned tools (mise)
        if: matrix.language == 'go'
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - name: Initialise CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
      - name: Build the Go server for CodeQL
        if: matrix.build-mode == 'manual'
        working-directory: apps/server
        run: go build ./...
      - name: Analyse and upload the results
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
