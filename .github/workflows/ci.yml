name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # reused by release.yml as a gate before publishing

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./server/...
      - run: go test -race ./server/...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f deploy/Dockerfile -t analytics-mlz-no:ci .

  tracker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tracker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: tracker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Check that the embedded script.js is up to date
        run: |
          npm run build
          git diff --exit-code -- ../server/internal/tracker/script.js || {
            echo "::error::server/internal/tracker/script.js is stale. Run 'npm run build' in tracker/ and commit."
            exit 1
          }

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Known vulnerabilities in Go dependencies and the standard library
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./server/...
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      # Only what ships to users: production dependencies of the dashboard.
      - name: npm audit (web)
        working-directory: web
        run: npm audit --audit-level=high --omit=dev
