version: 2
updates:
  - package-ecosystem: gomod
    directory: /apps/server
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]

  # One Bun workspace: the root lockfile covers apps/web and apps/tracker.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      js-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /infra/terraform/main
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: /infra/terraform/bootstrap
    schedule:
      interval: weekly
