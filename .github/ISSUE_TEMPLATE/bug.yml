name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `analytics version`, or the image tag.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Server / API, Dashboard, Tracking script, Docker / self-hosting, GCP / Terraform, Docs]
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: How you run it (Docker, binary, Cloud Run), browser and OS if relevant. Do not paste secrets.
  - type: textarea
    id: logs
    attributes:
      label: Logs or console output
      render: shell
