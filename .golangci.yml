version: "2"
linters:
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert
  settings:
    gosec:
      excludes:
        - G104 # unhandled errors are covered by errcheck
  exclusions:
    rules:
      # Tests build request cookies and fixture URLs that gosec misreads as unsafe.
      - path: _test\.go
        linters: [gosec]
formatters:
  enable:
    - gofmt
    - goimports
