# Findings that CI's image scan may ignore, each with a reason and an expiry. When one expires
# the scan fails again, so every entry is re-examined instead of forgotten.
vulnerabilities:
  - id: CVE-2026-116587
    # In the Litestream binary (go-jose, used for Google Cloud auth), not in our code. Denial of
    # service through a crafted JWS; Litestream only parses tokens from Google's own token
    # endpoint. Waiting for a Litestream release built against go-jose >= 4.1.6.
    paths:
      - usr/local/bin/litestream
    expired_at: 2026-12-15
